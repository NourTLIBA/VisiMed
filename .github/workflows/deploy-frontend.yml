name: Deploy Frontend to Netlify

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned to the version the project's android/ config targets. The
          # latest stable ships AGP 9, which rejects this project's legacy
          # build.gradle.kts DSL. Bump this only alongside `flutter upgrade` +
          # regenerating android/.
          flutter-version: '3.32.5'

      - name: Build Flutter Web
        working-directory: frontend
        env:
          VISIMED_API_URL: ${{ secrets.VISIMED_API_URL }}
        run: |
          flutter build web --release \
            --dart-define=VISIMED_API_URL="${VISIMED_API_URL:-https://visimed-api.onrender.com/api}"

      - name: Deploy to Netlify
        uses: netlify/actions/cli@master
        with:
          args: deploy --dir=frontend/build/web --prod
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
