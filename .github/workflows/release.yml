name: Release build (APK + web)

# Produces downloadable builds people can try:
#   • a universal Android APK  (debug-signed — fine for side-loading)
#   • a zipped Flutter-web bundle
# and attaches them to a GitHub Release. The web bundle always ships; if the APK
# step fails the release is still created with the web zip and the gradle error
# is written to the run summary.
#
# Trigger: push a tag like `v1.0.0`, or run manually (Actions → Release build →
# Run workflow) — the manual run makes a pre-release tagged `manual-<run>`.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      api_url:
        description: Backend API base URL to bake in
        default: https://visimed-api.onrender.com/api
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          # Pinned: latest stable ships AGP 9, which fails to apply the Flutter
          # Gradle plugin against this project's legacy build.gradle.kts.
          # Matches the version android/ was generated for. Bump only with
          # `flutter upgrade` + regenerating android/.
          flutter-version: '3.32.5'
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" "platforms;android-36" \
            "build-tools;35.0.0" || true

      - run: flutter --version && flutter doctor -v

      - run: flutter pub get

      - name: Resolve config
        id: cfg
        run: |
          URL="${{ github.event.inputs.api_url }}"
          URL="${URL:-${{ secrets.VISIMED_API_URL }}}"
          URL="${URL:-https://visimed-api.onrender.com/api}"
          echo "api_url=$URL" >> "$GITHUB_OUTPUT"
          echo "version=$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Build web
        run: |
          flutter build web --release \
            --dart-define=VISIMED_API_URL="${{ steps.cfg.outputs.api_url }}"
          mkdir -p ../dist
          (cd build/web && zip -qr "../../../dist/visimed-web-${{ steps.cfg.outputs.version }}.zip" .)

      - name: Build APK
        id: apk
        continue-on-error: true
        run: |
          set -o pipefail
          flutter build apk --release --verbose \
            --dart-define=VISIMED_API_URL="${{ steps.cfg.outputs.api_url }}" \
            2>&1 | tee ../dist/apk-build.log
          cp build/app/outputs/flutter-apk/app-release.apk \
             "../dist/visimed-${{ steps.cfg.outputs.version }}.apk"

      - name: Report APK failure
        if: steps.apk.outcome == 'failure'
        run: |
          {
            echo "## ❌ APK build failed"
            echo "### Key lines"
            echo '```'
            grep -inE 'FAILURE:|What went wrong|> Task .*FAILED|Caused by:|Exception|^e: |error:|Could not (find|resolve|create)|not (found|configured|specified)|requires .*(version|Java)|Inconsistent|Namespace not|Execution failed' ../dist/apk-build.log | tail -80 || echo "(no keyword matches)"
            echo '```'
            echo "### Last 200 lines"
            echo '```'
            tail -200 ../dist/apk-build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK build log
        if: steps.apk.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: apk-build-log
          path: dist/apk-build.log

      - name: Release notes body
        id: notes
        run: |
          {
            echo 'Downloadable builds of VisiMed.'
            echo
            echo '- **Web** (any device): unzip `visimed-web-*.zip`, serve the folder, open in a browser.'
            if [ "${{ steps.apk.outcome }}" = "failure" ]; then
              echo '- **Android**: build failed on CI. Gradle output tail:'
              echo
              echo '```'
              tail -c 5000 ../dist/apk-build.log
              echo '```'
            else
              echo '- **Android**: `visimed-*.apk` attached — allow "install unknown apps", then open it (debug-signed, Play Protect may warn).'
            fi
            echo
            echo "API baked in: ${{ steps.cfg.outputs.api_url }}"
            echo 'Demo logins: medrep1 / med123 · pharmrep1 / pharma123 · admin / admin123'
          } > ../dist/notes.md

      - name: Tag for manual runs
        if: github.event_name == 'workflow_dispatch'
        run: echo "RELEASE_TAG=manual-${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG || github.ref_name }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' }}
          fail_on_unmatched_files: false
          body_path: dist/notes.md
          files: |
            dist/visimed-*.apk
            dist/visimed-web-*.zip
