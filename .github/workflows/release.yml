name: Release build (APK + web)

# Produces downloadable builds people can try:
#   • a universal Android APK  (debug-signed — fine for side-loading)
#   • a zipped Flutter-web bundle
# and attaches them to a GitHub Release. The web bundle always ships; if the APK
# step fails the release is still created with the web zip and the gradle error
# is written to the run summary.
#
# Trigger: push a tag like `v1.0.0`, or run manually (Actions → Release build →
# Run workflow) — the manual run makes a pre-release tagged `manual-<run>`.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      api_url:
        description: Backend API base URL to bake in
        default: https://visimed-api.onrender.com/api
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" "platforms;android-36" \
            "build-tools;35.0.0" || true

      - run: flutter --version && flutter doctor -v

      - run: flutter pub get

      - name: Resolve config
        id: cfg
        run: |
          URL="${{ github.event.inputs.api_url }}"
          URL="${URL:-${{ secrets.VISIMED_API_URL }}}"
          URL="${URL:-https://visimed-api.onrender.com/api}"
          echo "api_url=$URL" >> "$GITHUB_OUTPUT"
          echo "version=$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Build web
        run: |
          flutter build web --release \
            --dart-define=VISIMED_API_URL="${{ steps.cfg.outputs.api_url }}"
          mkdir -p ../dist
          (cd build/web && zip -qr "../../../dist/visimed-web-${{ steps.cfg.outputs.version }}.zip" .)

      - name: Build APK
        id: apk
        continue-on-error: true
        run: |
          set -o pipefail
          flutter build apk --release --verbose \
            --dart-define=VISIMED_API_URL="${{ steps.cfg.outputs.api_url }}" \
            2>&1 | tee ../dist/apk-build.log
          cp build/app/outputs/flutter-apk/app-release.apk \
             "../dist/visimed-${{ steps.cfg.outputs.version }}.apk"

      - name: Report APK failure
        if: steps.apk.outcome == 'failure'
        run: |
          {
            echo "## ❌ APK build failed"
            echo "### Key lines"
            echo '```'
            grep -inE 'FAILURE:|What went wrong|> Task .*FAILED|Caused by:|Exception|^e: |error:|Could not (find|resolve|create)|not (found|configured|specified)|requires .*(version|Java)|Inconsistent|Namespace not|Execution failed' ../dist/apk-build.log | tail -80 || echo "(no keyword matches)"
            echo '```'
            echo "### Last 200 lines"
            echo '```'
            tail -200 ../dist/apk-build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK build log
        if: steps.apk.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: apk-build-log
          path: dist/apk-build.log

      - name: Tag for manual runs
        if: github.event_name == 'workflow_dispatch'
        run: echo "RELEASE_TAG=manual-${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG || github.ref_name }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' }}
          fail_on_unmatched_files: false
          generate_release_notes: true
          files: |
            dist/visimed-*.apk
            dist/visimed-web-*.zip
          body: |
            Downloadable builds of VisiMed.

            - **Web** (works on any device): the live app is the easiest way to
              try it — your Netlify site (add to home screen for a PWA). The zip
              here is the same bundle for self-hosting.
            - **Android**: if `visimed-<version>.apk` is attached below, download
              it, then allow install from unknown sources on your device. It is
              debug-signed, so Play Protect may warn — expected for a side-load.
              If it's missing, the APK build failed — see the run summary.

            API baked in: `${{ steps.cfg.outputs.api_url }}`
            Demo logins: `medrep1` / `med123` · `pharmrep1` / `pharma123` · `admin` / `admin123`
