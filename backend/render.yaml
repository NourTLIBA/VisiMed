# Render Blueprint — https://render.com/docs/blueprint-spec
# Create once: Render Dashboard → New → Blueprint → pick this repo.
# Render then reads this file and provisions the web service + Postgres.
services:
  - type: web
    name: visimed-api
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    rootDir: backend
    buildCommand: >-
      pip install -r requirements.txt &&
      python manage.py collectstatic --no-input &&
      python manage.py migrate --no-input &&
      python manage.py seed_users &&
      python manage.py seed_localities &&
      python manage.py seed_products &&
      python manage.py seed_visits --if-empty &&
      python manage.py backfill_targets
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /api/health/
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      # Set this to the deployed web app's origin, e.g. https://visimed.netlify.app
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Showcase deployment: fill empty analytics fields with coherent demo
      # values. Set to "false" once real data is being entered.
      - key: DEMO_MOCK
        value: "true"
      - key: POSTGRES_NAME
        fromDatabase:
          name: visimed-db
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: visimed-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: visimed-db
          property: password
      - key: POSTGRES_HOST
        fromDatabase:
          name: visimed-db
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: visimed-db
          property: port

databases:
  - name: visimed-db
    databaseName: visimed
    user: visimed
    plan: free
    region: frankfurt
