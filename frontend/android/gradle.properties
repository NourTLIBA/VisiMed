org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Djava.net.preferIPv4Stack=true
android.useAndroidX=true
android.enableJetifier=true
# The Gradle daemon's client<->daemon loopback socket fails on some Windows
# setups ("Unable to establish loopback connection"); running in-process avoids
# it. CI (release.yml) is unaffected either way.
org.gradle.daemon=false
